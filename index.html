    <meta name="description" content="Aprenda Java, Python, JavaScript, HTML e CSS na prática com lições interativas, editor de código e execução em tempo real." />
    <meta property="og:title" content="DualDev - Academia de Programação" />

    <!-- Configurações PWA e Mobile para rodar no Celular como Aplicativo -->
    <meta name="theme-color" content="#0e1626" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="icon" type="image/svg+xml" href="./assets/icons/app-icon-192.svg" />

    <script>
      // Garante a barra final na URL do repositório no GitHub Pages para que assets relativos nunca dêem 404
      if (window.location.pathname.split('/').pop().indexOf('.') === -1 && !window.location.pathname.endsWith('/')) {
        window.location.replace(window.location.pathname + '/' + window.location.search + window.location.hash);
      }
    </script>

  <body class="min-h-screen bg-[#0b101b] text-slate-100 selection:bg-[#ffbe82]/30 selection:text-white">

  </body>
